<!doctype html>
<!--
  For Netlify Forms only. Netlify finds forms by parsing the deployed HTML,
  and the app renders its contact form with JavaScript, so this static copy
  declares the form: its name and its fields' names must match the app's
  (src/Contact/constants.ts). The app posts submissions itself (fetch).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Contact form</title>
  </head>
  <body>
    <form
      name="contact"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
