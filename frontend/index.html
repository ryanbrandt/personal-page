<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The --rq-color-bg token of each scheme. -->
    <meta
      name="theme-color"
      content="#f6f7fb"
      media="(prefers-color-scheme: light)"
      data-color-scheme="light"
    />
    <meta
      name="theme-color"
      content="#12141b"
      media="(prefers-color-scheme: dark)"
      data-color-scheme="dark"
    />
    <script>
      // Applies the stored theme preference before the page first renders, so
      // it never flashes the wrong theme. React takes over from the attribute
      // this sets; keep in sync with src/common/utils/theme.ts.
      (() => {
        let preference = "system";
        try {
          const stored = localStorage.getItem("theme");
          if (["light", "dark", "system"].includes(stored)) {
            preference = stored;
          }
        } catch {
          // Storage can be unavailable (e.g. blocked); use the default.
        }
        document.documentElement.dataset.theme = preference;
        if (preference !== "system") {
          document
            .querySelectorAll("meta[data-color-scheme]")
            .forEach((meta) => {
              meta.media =
                meta.dataset.colorScheme === preference ? "all" : "not all";
            });
        }
      })();
    </script>
    <title>Ryan Brandt | Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
